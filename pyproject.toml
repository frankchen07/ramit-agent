[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ramit-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "openai>=1.0.0",
    "python-telegram-bot>=21.0",
    "langgraph>=0.2.0",
    "langgraph-checkpoint-postgres>=2.0.0",
    "psycopg[binary,pool]>=3.1",
    "sentence-transformers>=3.0.0",
    "numpy>=1.26.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
pipeline = [
    "pymupdf4llm>=0.0.17",
    "python-docx>=1.1.0",
    "tiktoken>=0.7.0",
    "pyyaml>=6.0",
    "tqdm>=4.66.0",
    "fastmcp>=2.0",
    "openai>=1.0.0",
]
dev = [
    "ramit-agent[pipeline]",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
