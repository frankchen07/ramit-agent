services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ramit
      POSTGRES_PASSWORD: ramit
      POSTGRES_DB: ramit
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres-data:
